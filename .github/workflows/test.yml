name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server.js
          node --input-type=module -e "import('./worker.js').then(() => console.log('worker.js parses'))"
      - name: Smoke test (local server)
        run: node scripts/smoke.mjs
